[project]
name = "rueda-build"
version = "0.1.0"
description = "Builds the rueda wheel and copies it into the rueda plugin's skills"
authors = [
    { name = "Martin Ignacio Alonso" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
build = "rueda_build:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
