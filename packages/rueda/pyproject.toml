[project]
name = "rueda"
version = "0.1.0"
description = "Tools for Argentine market instruments: CNV filings, SEC 20-F filings, ON payment schedules and yields"
readme = "README.md"
authors = [
    { name = "Martin Ignacio Alonso" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "olefile>=0.47",
    "pypdf>=6.20.0",
    "requests>=2.34.2",
]

[project.scripts]
rueda = "rueda.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "rueda-build",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = [
    "tools/rueda-build",
]

[tool.uv.sources]
rueda-build = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "COM812",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # allow assert and literal numbers in tests

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "possibly-undefined",
]